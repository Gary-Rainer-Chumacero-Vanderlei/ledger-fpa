name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (análise)
        run: ruff check .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest
